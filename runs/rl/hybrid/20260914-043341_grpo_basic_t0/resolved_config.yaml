environment:
  name: basic_t0
  action_chunk_size: 8
  control_hz: 30
  max_episode_chunks: 2
  position_jitter_m: 0.005
  yaw_jitter_deg: 10.0
reward:
  approach_scale: 10.0
  grasp_bonus: 1.0
  lift_scale: 20.0
  lift_bonus: 2.0
  transport_scale: 10.0
  inside_bonus: 4.0
  release_bonus: 2.0
  success_bonus: 10.0
  time_penalty: -0.001
  failure_penalty: -10.0
  lift_threshold_m: 0.01
  stable_seconds: 3.0
  max_linear_speed_m_s: 0.01
  max_angular_speed_rad_s: 0.2
policy:
  kind: mlp_squashed_gaussian
  hidden_sizes:
  - 256
  - 256
  initial_log_std: -3.0
collection:
  num_envs: 4
  steps_per_env_per_update: 2
  group_size: 4
algorithm:
  name: grpo
  gamma: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  value_clip_coefficient: 0.2
  value_coefficient: 0.0
  entropy_coefficient: 0.01
  learning_rate: 0.0003
  epochs: 1
  minibatch_size: 8
  max_gradient_norm: 0.5
  kl_coefficient: 0.0
training:
  seed: 42
  device: auto
  total_updates: 2
  evaluation_interval: 2
  evaluation_episodes: 4
  checkpoint_interval: 2
  output_root: runs/rl/hybrid
  route: hybrid
  source: sim
  run_name: null
