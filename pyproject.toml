[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-so101-vla-rl"
version = "0.1.0"
description = "OpenVLA and VLA-RL development for the SO-101 robot arm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "no:launch_testing",
    "-p", "no:launch_ros",
    "-p", "no:ament_copyright",
    "-p", "no:ament_flake8",
    "-p", "no:ament_lint",
    "-p", "no:ament_pep257",
    "-p", "no:ament_xmllint",
]

[tool.ruff]
target-version = "py312"
