schema_version: 1
experiment_name: so101_battery_openvla_oft_lora

dataset:
  # Fill one of these after the first dataset is recorded.
  repo_id: null
  root: null
  project_meta_dir: project_meta
  fps: 30
  image_keys:
    - observation.images.front
  state_key: observation.state
  action_key: action
  action_source: robot_send_action_return
  task_key: task
  task_language: en
  task_format: canonical_atomic_transfer_v1
  successful_episodes_only: true
  normalization:
    method: bounds_q99
    lower_quantile: 0.01
    upper_quantile: 0.99
    clip: true
    stats_split: train
    unnorm_key: so101_battery_v1

model:
  checkpoint: openvla/openvla-7b
  adapter: openvla_oft
  action_head: continuous
  loss: l1
  action_dim: 6
  proprio_dim: 6
  action_chunk_size: 8
  action_representation: absolute_joint_target
  use_proprio: true
  num_images: 1
  image_size: 224

lora:
  enabled: true
  rank: 32
  alpha: 16
  dropout: 0.0
  target_modules: all-linear

optimizer:
  name: adamw
  learning_rate: 0.0005
  weight_decay: 0.0
  scheduler: cosine
  warmup_ratio: 0.03

training:
  seed: 42
  # These values depend on the dataset size and cloud GPU. The training-ready
  # validator rejects the configuration until all of them are filled.
  max_steps: null
  per_device_train_batch_size: null
  gradient_accumulation_steps: null
  num_workers: null
  logging_steps: 10
  eval_steps: null
  save_steps: null
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  image_augmentation: true
  output_dir: null
